<main class="main">
<div class="eyebrow">YOUR AI COMPANION</div>
<h1>Meet JARVIS.</h1>
<p>Your intelligent study companion.</p>

<div class="tool-card" style="margin-top:30px">
<h2>✦ JARVIS</h2>
<p>Ask questions, brainstorm ideas, or get help with your learning.</p>
<div id="chat" style="margin:20px 0;padding:15px;background:#15151e;border-radius:12px">
<p>JARVIS: Hello. I'm ready when you are.</p>
</div>
<form id="chat-form">
<input id="message" placeholder="Ask JARVIS something..." required style="width:100%;padding:14px;border-radius:12px;margin-bottom:12px">
<button type="submit" class="nav-item">Send message ↗</button>
</form>
<p style="margin-top:15px;font-size:12px">AI connection will be added in a later step.</p>
</div>
</main>

<script>
document.getElementById("chat-form").addEventListener("submit",function(e){
e.preventDefault();
const msg=document.getElementById("message").value.trim();
if(!msg)return;
const chat=document.getElementById("chat");
chat.innerHTML += "<p><b>You:</b> "+msg.replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</p>";
chat.innerHTML += "<p>JARVIS: The AI connection isn't active yet. We'll connect me soon.</p>";
document.getElementById("message").value="";
});
</script>
</body>
