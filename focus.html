
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velto | Focus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sidebar">
<div class="brand">velto<span>.</span></div>
<div class="nav-label">WORKSPACE</div>
<a class="nav-item" href="index.html">⌂ &nbsp; Home</a>
<a class="nav-item active" href="focus.html">◷ &nbsp; Focus</a>

</div>
<main>
<header>
<div>
<div class="eyebrow">DEEP WORK</div>
<h1>Focus <span>mode.</span></h1>
<p class="sub">One thing at a time.</p>
</div>
<div class="profile">V</div>
</header>

<section class="welcome">
<div>
<div class="eyebrow">YOUR SPACE</div>
<h2>Disconnect.<br>Concentrate.</h2>
<p>Your focus space is being prepared.</p>
</div>
<div class="orb"></div>
</section>

<section class="section">
<div class="tool-card" style="text-align:center">
<div class="eyebrow">SESSION TIMER</div>
<h1 id="timer" style="font-size:65px">25:00</h1>
<p>25 minute focus session</p>
<button class="primary-btn" id="startBtn" onclick="startTimer()">Start session</button>
<button class="primary-btn" onclick="resetTimer()" style="margin-left:8px">Reset</button>
</div>
</section>
</main>
<script>
let seconds=1500, interval=null;
function renderTimer(){
document.getElementById('timer').textContent=
String(Math.floor(seconds/60)).padStart(2,'0')+':'+
String(seconds%60).padStart(2,'0');
}
function startTimer(){
if(interval)return;
document.getElementById('startBtn').textContent='Running...';
interval=setInterval(()=>{
if(seconds>0){seconds--;renderTimer();}
else{clearInterval(interval);interval=null;
document.getElementById('startBtn').textContent='Session complete';}
},1000);
}
function resetTimer(){
clearInterval(interval);interval=null;seconds=1500;
renderTimer();document.getElementById('startBtn').textContent='Start session';
}
</script>
</body>
</html>
